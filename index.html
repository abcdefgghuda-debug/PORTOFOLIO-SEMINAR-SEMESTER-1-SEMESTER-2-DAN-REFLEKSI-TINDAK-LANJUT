                    <!-- Artefak -->
                    <section class="mb-14 relative">
                        <div class="absolute -left-4 top-0 bottom-0 w-1 bg-gradient-to-b from-emas-700/0 via-emas-500 to-emas-700/0"></div>
                        <div class="flex items-center space-x-4 mb-8 pl-4">
                            <div class="w-12 h-12 bg-emas-900/40 border border-emas-500 rounded-full flex items-center justify-center text-emas-400"><i class="ph ph-folder-open text-2xl"></i></div>
                            <h2 class="text-2xl font-serif font-bold text-white tracking-wide">Artefak Pembelajaran</h2>
                        </div>
                        <div class="pl-0 md:pl-4">
                            ${artifactsHtml}
                        </div>
                    </section>

                    <!-- Kaitan Praktis -->
                    <section class="mb-16">
                        <div class="flex items-center space-x-4 mb-8">
                            <div class="w-12 h-12 bg-emas-900/40 border border-emas-500 rounded-full flex items-center justify-center text-emas-400"><i class="ph ph-briefcase text-2xl"></i></div>
                            <h2 class="text-2xl font-serif font-bold text-white tracking-wide">Kaitan Praktis</h2>
                        </div>
                        <div class="glass-card p-8 md:p-10 rounded-2xl relative overflow-hidden">
                            <i class="ph ph-quotes absolute text-9xl -top-4 -right-4 text-emas-900/30 rotate-12"></i>
                            <div class="text-gray-200 font-light text-lg leading-relaxed relative z-10">
                                ${renderParagraphs(detail.praktis)}
                            </div>
                        </div>
                    </section>

                    <!-- Navigasi Bawah -->
                    <div class="flex justify-between items-center pt-8 border-t border-emas-700/30">
                        ${prevCourse ? `<a href="#/matkul/${prevCourse}" class="group flex items-center text-sm md:text-base font-bold uppercase tracking-wider text-gray-400 hover:text-emas-400 transition-colors"><i class="ph ph-arrow-left mr-3 text-xl group-hover:-translate-x-1 transition-transform"></i> Sebelumnya</a>` : '<div></div>'}
                        <a href="#/${prefix}" class="w-12 h-12 rounded-full bg-black/50 border border-emas-700/30 text-emas-500 flex items-center justify-center hover:bg-emas-900/50 hover:border-emas-500 transition-all shadow-[0_0_10px_rgba(212,175,55,0.1)]" title="Ke Daftar Modul"><i class="ph ph-grid-four text-xl"></i></a>
                        ${nextCourse ? `<a href="#/matkul/${nextCourse}" class="group flex items-center text-sm md:text-base font-bold uppercase tracking-wider text-gray-400 hover:text-emas-400 transition-colors">Berikutnya <i class="ph ph-arrow-right ml-3 text-xl group-hover:translate-x-1 transition-transform"></i></a>` : '<div></div>'}
                    </div>
                </div>
            `;
        };

        const renderPPG = () => {
            const data = siteData.refleksiPPG;
            
            const createSection = (title, content, icon, delay) => `
                <div class="glass-card rounded-2xl p-8 md:p-10 mb-8 relative overflow-hidden group transition-all" style="animation: fadeIn 0.8s ease-out ${delay}s both;">
                    <div class="absolute w-2 h-full top-0 left-0 bg-gradient-to-b from-emas-300 to-emas-700 opacity-50 group-hover:opacity-100 transition-opacity"></div>
                    <div class="flex items-start md:items-center flex-col md:flex-row mb-6 pl-4 md:pl-6">
                        <div class="w-14 h-14 rounded-full bg-black/60 border-2 border-emas-600 flex items-center justify-center text-emas-400 mb-4 md:mb-0 md:mr-6 shadow-[0_0_15px_rgba(202,138,4,0.3)]">
                            <i class="ph ${icon} text-3xl"></i>
                        </div>
                        <h3 class="text-2xl font-serif font-bold text-white tracking-wide">${title}</h3>
                    </div>
                    <div class="text-gray-300 md:pl-[88px] font-light text-lg leading-relaxed">
                        ${renderParagraphs(content)}
                    </div>
                </div>
            `;

            app.innerHTML = `
                <div class="fade-in max-w-4xl mx-auto">
                    <div class="text-center mb-16">
                        <span class="text-emas-500 font-bold tracking-widest uppercase text-xs mb-2 block border-b border-emas-700/50 w-max mx-auto pb-2"><i class="ph ph-compass"></i> Sintesis Perjalanan</span>
                        <h1 class="text-4xl md:text-5xl font-serif font-bold mb-6 text-white leading-tight">Refleksi Makna PPG</h1>
                        <p class="text-gray-400 font-light text-lg max-w-2xl mx-auto">Catatan mendalam tentang penemuan jati diri, pandangan atas pendidikan Indonesia, serta komitmen menjadi guru profesional.</p>
                    </div>

                    ${createSection('Identifikasi Diri', data.identifikasi, 'ph-fingerprint', 0.1)}
                    ${createSection('Pendidikan di Indonesia', data.pendidikan, 'ph-globe-hemisphere-east', 0.2)}
                    ${createSection('Upaya Menjadi Guru Profesional', data.upaya, 'ph-steps', 0.3)}
                    ${createSection('Rencana Tindak Lanjut', data.rtl, 'ph-list-checks', 0.4)}
                </div>
            `;
        };

        const renderClosing = () => {
            const data = siteData.penutup;
            app.innerHTML = `
                <div class="fade-in max-w-4xl mx-auto text-center mt-12 mb-20 relative">
                    <!-- Dekorasi Belakang -->
                    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[120%] h-[120%] bg-emas-700/5 rounded-full blur-3xl -z-10 mix-blend-screen pointer-events-none"></div>

                    <div class="inline-flex items-center justify-center w-24 h-24 rounded-full border border-emas-600 bg-black/50 mb-8 shadow-[0_0_30px_rgba(212,175,55,0.2)]">
                        <i class="ph ph-quotes text-5xl text-emas-400"></i>
                    </div>
                    
                    <h1 class="text-4xl md:text-5xl font-serif font-bold mb-10 text-white tracking-wide">Kesan <span class="text-emas-500 font-light italic">&</span> Pesan</h1>
                    
                    <div class="glass-card p-8 md:p-12 rounded-3xl mb-12 text-left relative overflow-hidden border-t-4 border-t-emas-500 shadow-2xl">
                        <div class="text-xl md:text-2xl text-gray-200 font-serif italic leading-relaxed mb-8 relative z-10 font-light">
                            ${renderParagraphs(data.kesan)}
                        </div>
                        <div class="h-px bg-gradient-to-r from-transparent via-emas-700/50 to-transparent w-full my-8"></div>
                        <div class="text-gray-400 font-light text-lg leading-relaxed relative z-10 text-justify">
                            <strong class="text-emas-400 font-serif font-bold uppercase tracking-widest text-sm block mb-4">Ucapan Terima Kasih</strong>
                            ${renderParagraphs(data.ucapan)}
                        </div>
                    </div>

                    <div class="pt-8">
                        <h3 class="text-emas-500 text-sm uppercase tracking-widest font-bold mb-8 relative inline-block">
                            <span class="bg-black px-4 relative z-10">Mari Terhubung</span>
                            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[200%] h-px bg-emas-800/50 z-0"></div>
                        </h3>
                        <div class="flex justify-center space-x-8">
                            <a href="mailto:khairul.huda@example.com" class="text-gray-400 hover:text-white transition flex flex-col items-center group">
                                <div class="w-14 h-14 rounded-full bg-black/80 border border-emas-800 group-hover:border-emas-400 flex items-center justify-center mb-3 group-hover:bg-emas-900/30 transition-all shadow-lg">
                                    <i class="ph ph-envelope-simple text-2xl group-hover:text-emas-400 transition-colors"></i>
                                </div>
                                <span class="text-xs font-medium tracking-wide">Email</span>
                            </a>
                            <a href="#" class="text-gray-400 hover:text-white transition flex flex-col items-center group">
                                <div class="w-14 h-14 rounded-full bg-black/80 border border-emas-800 group-hover:border-blue-500 flex items-center justify-center mb-3 group-hover:bg-blue-900/30 transition-all shadow-lg">
                                    <i class="ph ph-linkedin-logo text-2xl group-hover:text-blue-400 transition-colors"></i>
                                </div>
                                <span class="text-xs font-medium tracking-wide">LinkedIn</span>
                            </a>
                        </div>
                    </div>
                </div>
            `;
        };

        // Router
        const router = () => {
            const hash = window.location.hash.slice(1) || '/beranda';
            
            // Update Active Nav State
            document.querySelectorAll('.nav-link').forEach(link => {
                const route = link.getAttribute('data-route');
                const isSemester1Active = hash.startsWith('/matkul/s1-') && route === '/semester-1';
                const isSemester2Active = hash.startsWith('/matkul/s2-') && route === '/semester-2';
                
                if(route === hash || isSemester1Active || isSemester2Active) {
                    link.classList.add('text-emas-500', 'font-bold');
                    link.classList.remove('text-gray-300');
                    // Add subtle glow indicator under active nav item
                    if(!link.querySelector('.nav-indicator') && window.innerWidth >= 768) {
                       const indicator = document.createElement('div');
                       indicator.className = 'nav-indicator absolute -bottom-5 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-emas-500 rounded-full shadow-[0_0_8px_#eab308]';
                       link.style.position = 'relative';
                       link.appendChild(indicator);
                    }
                } else {
                    link.classList.remove('text-emas-500', 'font-bold');
                    link.classList.add('text-gray-300');
                    const indicator = link.querySelector('.nav-indicator');
                    if(indicator) indicator.remove();
                }
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (hash === '/beranda') { renderHome(); }
            else if (hash === '/semester-1') { renderSemester('1'); }
            else if (hash === '/semester-2') { renderSemester('2'); }
            else if (hash.startsWith('/matkul/')) { renderCourse(hash.split('/')[2]); }
            else if (hash === '/refleksi-ppg') { renderPPG(); }
            else if (hash === '/penutup') { renderClosing(); }
            else { renderHome(); }
            
            document.getElementById('mobile-menu').classList.add('hidden');
        };

        // Mobile Menu Toggle
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        // Initialize App
        window.addEventListener('hashchange', router);
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('current-year').textContent = new Date().getFullYear();
            router();
        });

    </script>
</body>
</html>
